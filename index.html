<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitStart AI</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202611041937">
</head>
<body data-page="home">
<!-- ส่วนหัว เมนู และส่วนท้าย ถูกเพิ่มอัตโนมัติจาก js/layout.js -->

<main>
  <!-- Hero -->
  <div class="wrap hero">
    <div>
      <span class="pill"><span data-i18n="heroPill"></span></span>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="btn-row">
        <a href="planner.html" class="btn" data-i18n="heroCta"></a>
        <a href="#topics" class="btn ghost" data-i18n="heroCta2"></a>
      </div>
    </div>
    <div class="hero-card" aria-hidden="true">
      <div class="hero-figs"><div class="fig" data-fig="run"></div><div class="fig" data-fig="dbpress"></div><div class="fig" data-fig="squat"></div></div>
      <div class="mini-plan">
        <div><span data-i18n="miniD1"></span><span data-i18n="mini20"></span></div>
        <div><span data-i18n="miniD2"></span><span data-i18n="mini15"></span></div>
        <div><span data-i18n="miniD3"></span><span data-i18n="mini25"></span></div>
      </div>
      <div class="stat-row">
        <div class="stat"><b>40+</b><span data-i18n="statEx"></span></div>
        <div class="stat"><b>0฿</b><span data-i18n="statFree"></span></div>
        <div class="stat"><b>1 min</b><span data-i18n="statFast"></span></div>
      </div>
    </div>
  </div>

  <!-- Categories -->
  <section id="topics">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="catTitle"></h2>
        <p data-i18n="catSub"></p>
      </div>
      <div class="cats">
        <a class="cat" href="for-you.html"><div class="fig" data-fig="wave"></div><h3 data-i18n="navForYou"></h3><p data-i18n="cForYouD"></p><span class="go" data-i18n="go"></span></a>
        <a class="cat" href="muscle.html"><div class="fig" data-fig="curl"></div><h3 data-i18n="navMuscle"></h3><p data-i18n="cMuscleD"></p><span class="go" data-i18n="go"></span></a>
        <a class="cat" href="weight-loss.html"><div class="fig" data-fig="run"></div><h3 data-i18n="navLose"></h3><p data-i18n="cLoseD"></p><span class="go" data-i18n="go"></span></a>
        <a class="cat" href="planner.html"><div class="fig" data-fig="jj"></div><h3 data-i18n="navPlan"></h3><p data-i18n="cPlanD"></p><span class="go" data-i18n="go"></span></a>
        <a class="cat" href="bmi.html"><div class="fig" data-fig="calf"></div><h3 data-i18n="navBmi"></h3><p data-i18n="cBmiD"></p><span class="go" data-i18n="go"></span></a>
        <a class="cat" href="more.html"><div class="fig" data-fig="dog"></div><h3 data-i18n="navMore"></h3><p data-i18n="cMoreD"></p><span class="go" data-i18n="go"></span></a>
      </div>
    </div>
  </section>

  <!-- How it works -->
  <section id="how">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="howTitle"></h2>
        <p data-i18n="howSub"></p>
      </div>
      <div class="steps">
        <div class="step"><div class="num">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
        <div class="step"><div class="num">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
        <div class="step"><div class="num">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
      </div>
    </div>
  </section>
</main>

<script src="js/i18n.js"></script>
<script src="js/data.js?v=202611041937"></script>
<script src="js/utils.js?v=202611041937"></script>
<script src="js/icons.js?v=202611041937"></script>
<script src="js/figures.js?v=202611041937"></script>
<script src="js/layout.js?v=202611041937"></script>
<script src="js/auth.js?v=202611041937"></script>
<script src="js/main.js?v=202611041937"></script>
</body>
</html>
