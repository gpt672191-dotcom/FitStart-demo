<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ของฉัน · FitStart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><span class="logo-mark">FS</span> FitStart AI</a>
    <nav class="nav-links">
      <a href="index.html#how" data-i18n="navHow"></a>
      <a href="index.html#planner" data-i18n="navPlan"></a>
      <a href="index.html#tools" data-i18n="navTools"></a>
      <a href="index.html#tips" data-i18n="navTips"></a>
    </nav>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="th">TH</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="btn sm" id="loginBtn" data-i18n="login"></button>
      <div class="user-menu" id="userMenu" hidden>
        <button type="button" class="user-btn" id="userBtn" aria-haspopup="true">
          <span class="avatar" id="avatar"></span><span class="uname" id="uname"></span>
        </button>
        <div class="dropdown" id="dropdown" hidden>
          <div class="who" id="whoEmail"></div>
          <a href="profile.html" id="ddProfile" data-i18n="profileTitle"></a>
          <a href="index.html#myplans" id="ddPlans" data-i18n="myPlans"></a>
          <button type="button" id="logoutBtn" data-i18n="logout"></button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Login / Sign-up modal -->
<div class="modal-bg" id="authModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button type="button" class="close" id="authClose" aria-label="Close">✕</button>
    <h2 id="authTitle" style="margin:0 0 4px;font-size:1.35rem"></h2>
    <p id="authSub" style="margin:0;color:var(--muted);font-size:.92rem"></p>
    <div class="tabs">
      <button type="button" data-tab="login" data-i18n="login"></button>
      <button type="button" data-tab="signup" data-i18n="signup"></button>
    </div>
    <form id="authForm" novalidate>
      <div class="field" id="nameField">
        <label for="aName" data-i18n="name"></label>
        <input id="aName" type="text" autocomplete="name" maxlength="40">
      </div>
      <div class="field">
        <label for="aEmail" data-i18n="email"></label>
        <input id="aEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="aPw" data-i18n="password"></label>
        <div class="pw-wrap">
          <input id="aPw" type="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-for="aPw" data-i18n="show"></button>
        </div>
      </div>
      <div class="field" id="pw2Field">
        <label for="aPw2" data-i18n="confirmPw"></label>
        <div class="pw-wrap">
          <input id="aPw2" type="password" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-for="aPw2" data-i18n="show"></button>
        </div>
      </div>
      <div class="form-err" id="authErr" role="alert"></div>
      <button type="submit" class="btn" id="authSubmit"></button>
    </form>
    <div class="switch-line"><span id="switchText"></span> <button type="button" id="switchBtn"></button></div>
    <div class="demo-note">🧪 <span data-i18n="demoNote"></span></div>
  </div>
</div>

<main class="page">
  <!-- Shown when logged out -->
  <section id="profileGate" hidden>
    <div class="wrap">
      <div class="panel gate">
        <div class="gate-ico">👤</div>
        <h1 class="page-title" data-i18n="gateTitle"></h1>
        <p data-i18n="gateSub"></p>
        <div class="btn-row" style="justify-content:center">
          <button type="button" class="btn" id="gateLogin" data-i18n="login"></button>
          <a href="index.html" class="btn ghost" data-i18n="backHome"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Profile (logged-in only) -->
  <section id="profile" hidden>
    <div class="wrap">
      <a href="index.html" class="back-link" data-i18n="backHome"></a>
      <div class="sec-head">
        <h1 class="page-title" data-i18n="profileTitle"></h1>
        <p data-i18n="profileSub"></p>
      </div>
      <div class="profile-grid">
        <div class="panel tool">
          <div class="profile-who">
            <span class="avatar lg" id="pAvatar"></span>
            <div><b id="pName"></b><small id="pEmail"></small></div>
          </div>
          <form id="bodyForm" novalidate>
            <div class="field-row">
              <div class="field">
                <label for="pH" data-i18n="height"></label>
                <input id="pH" type="number" inputmode="decimal" min="100" max="230" step="0.1" placeholder="165">
              </div>
              <div class="field">
                <label for="pW" data-i18n="weight"></label>
                <input id="pW" type="number" inputmode="decimal" min="25" max="250" step="0.1" placeholder="60">
              </div>
            </div>
            <div class="bmi-out" id="pBmiOut" aria-live="polite"></div>
            <div class="form-err" id="bodyErr" role="alert"></div>
            <button type="submit" class="btn" data-i18n="saveBody"></button>
          </form>
        </div>
        <div class="panel tool">
          <h3 data-i18n="historyTitle"></h3>
          <p data-i18n="historySub"></p>
          <div id="trend"></div>
          <div class="hist-list" id="histList"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <p data-i18n="disclaimer"></p>
    <p>© 2026 FitStart AI</p>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/bmi.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
