<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำนวณ BMI · FitStart AI</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202611041937">
</head>
<body data-page="bmi">

<main>
  <div class="wrap page-hero has-fig">
    <div>
      <span class="pill"><span data-i18n="bmiPill"></span></span>
      <h1 data-i18n="bmiTitle"></h1>
      <p class="lead" data-i18n="bmiLead"></p>
    </div>
    <div class="fig hero-fig" data-fig="walk"></div>
  </div>

  <section class="tight">
    <div class="wrap two-col">
      <div class="panel tool">
        <h3 data-i18n="bmiTitle"></h3>
        <p data-i18n="bmiSub"></p>
        <div class="field-row">
          <div class="field">
            <label for="h" data-i18n="height"></label>
            <input id="h" type="number" inputmode="decimal" min="100" max="230" placeholder="165">
          </div>
          <div class="field">
            <label for="w" data-i18n="weight"></label>
            <input id="w" type="number" inputmode="decimal" min="25" max="250" placeholder="60">
          </div>
        </div>
        <div class="bmi-out" id="bmiOut"></div>
      </div>

      <div class="panel tool">
        <h3 data-i18n="bmiTableTitle"></h3>
        <table class="bmi-table" style="margin-top:12px"><tbody id="bmiTable"></tbody></table>
        <p class="hint" data-i18n="bmiNote"></p>
      </div>
    </div>
  </section>
</main>

<script src="js/i18n.js"></script>
<script src="js/data.js?v=202611041937"></script>
<script src="js/utils.js?v=202611041937"></script>
<script src="js/icons.js?v=202611041937"></script>
<script src="js/figures.js?v=202611041937"></script>
<script src="js/layout.js?v=202611041937"></script>
<script src="js/auth.js?v=202611041937"></script>
<script src="js/bmi.js?v=202611041937"></script>
<script src="js/main.js?v=202611041937"></script>
</body>
</html>
